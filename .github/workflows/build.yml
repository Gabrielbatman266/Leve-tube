name: Build Leve Tube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leve-tube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LEVE_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.LEVE_STORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/leve.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PW="$STORE_PW"
          else
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias leve -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Leve Tube"
          fi
          {
            echo "storeFile=$KS"
            echo "storePassword=$PW"
            echo "keyAlias=leve"
            echo "keyPassword=$PW"
          } > keystore.properties

      - name: Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((10000 + GITHUB_RUN_NUMBER))/" smarttubetv/build.gradle
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-leve${GITHUB_RUN_NUMBER}\"/" smarttubetv/build.gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --console=plain assembleStleveRelease -x lint 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Collect APK
        run: |
          mkdir -p out
          cp $(find smarttubetv/build/outputs/apk -name "*.apk" | head -1) out/LeveTube.apk
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="leve-tube-${{ github.run_number }}"
          gh release create "$TAG" out/LeveTube.apk \
            --target "${{ github.sha }}" \
            --title "Leve Tube #${{ github.run_number }}" \
            --notes "Leve Tube para TV box. Baixe LeveTube.apk abaixo." \
            --latest=false
